function usersCard(){ensureProfiles();return `<div class="card"><h2>Usuarios y accesos</h2><p class="sub">Administrador: ve y hace todo. Vendedor: vende, ve clientes, artículos (sin costos) y stock. Los permisos se controlan también en el servidor: un vendedor no puede leer gastos, compras, proveedores ni cierres de caja.</p>${profiles.length?profiles.map(u=>`<div class="li"><div><b>${esc(u.name)}</b>${u.id===me.id?' (vos)':''}<small>${esc(u.email)}</small><span class="chip ${u.role==='admin'?'':'bad'}">${u.role==='admin'?'Administrador':'Vendedor'}</span>${uEdit===u.id?`<div class="row" style="margin-top:8px;align-items:flex-end"><label>Contraseña nueva<input id="upn" type="password" autocomplete="new-password"></label><button class="pri" data-a="upset">Guardar</button></div>`:''}</div><div style="text-align:right"><button class="lnk" data-a="uedit" data-id="${u.id}">Cambiar contraseña</button><br><button class="lnk" data-a="urole" data-id="${u.id}">Pasar a ${u.role==='admin'?'vendedor':'administrador'}</button><br><button class="x" data-a="udel" data-id="${u.id}">${uDel===u.id?'¿Seguro?':'Eliminar'}</button></div></div>`).join(''):'<p class="empty">Cargando usuarios…</p>'}
<h2 style="margin-top:16px">Nuevo usuario</h2><div class="row"><label>Nombre<input id="un"></label><label>Mail<input id="um" type="email"></label></div><div class="row"><label>Rol<select id="ur"><option value="vendedor">Vendedor</option><option value="admin">Administrador</option></select></label><label>Contraseña (mínimo 8)<input id="up" type="password" autocomplete="new-password"></label></div><button class="pri big" data-a="uadd">Crear usuario</button></div>`}
function bkNote(){const l=cfg().lastbk,d=l?daysB(l,today()):null;if(l&&d<7)return '';return `<p class="note">💾 ${l?'Hace '+d+' días que no hacés una copia de seguridad.':'Todavía no hiciste ninguna copia de seguridad.'} <button class="lnk" data-t="aj">Hacer copia</button></p>`}
function aj(){const c=cfg(),l=c.lastbk,d=l?daysB(l,today()):null,n=k=>bkPend&&bkPend.db&&bkPend.db[k]?bkPend.db[k].length:0;
return `<h1>Ajustes</h1>
${connCard()}
${usersCard()}
<div class="card"><h2>Copia de seguridad</h2><p class="sub">${l?'Última copia: '+dmy(l)+(d===0?' (hoy)':' (hace '+d+' días)'):'Todavía no hiciste ninguna copia.'} Guarda todo: artículos, clientes, ventas, stock, compras y gastos.</p><button class="pri big" data-a="bkdl">Descargar copia de seguridad</button>
<h2 style="margin-top:18px">Restaurar una copia</h2><p class="sub">Reemplaza todo lo que hay ahora. Descargá una copia antes, por las dudas.</p><input type="file" id="bkf" accept=".json,application/json">
${bkPend?`<p class="note">Copia del ${esc(bkPend.date||'?')}: ${n('articles')} artículos, ${n('sales')} ventas y ${n('clients')} clientes. Esto <b>reemplaza todo</b> lo que hay ahora.</p><div class="row"><button class="x" data-a="bkgo">${bkSure?'¿Seguro? Tocá de nuevo para restaurar':'Restaurar esta copia'}</button><button data-a="bkno">Cancelar</button></div>`:''}</div>
<div class="card"><h2>Precio de tarjeta</h2><p class="sub">Cuánto más cobrás con tarjeta respecto del efectivo.</p><div class="row"><label>Recargo %<input id="tpct" type="number" inputmode="decimal" min="0" step="any" value="${c.tpct||''}"></label></div><label class="chk"><input type="checkbox" id="trd" ${c.trd!==false?'checked':''}> Redondear a múltiplos de $100</label><label class="chk"><input type="checkbox" id="tonly" checked> Solo a los que todavía tienen el mismo precio en efectivo y en tarjeta</label><button class="pri big" data-a="tapply">Aplicar a los artículos</button>
<h2 style="margin-top:18px">Formas de pago que usan el precio de tarjeta</h2>${['Tarjeta','Mercado Pago','Transferencia','Otro'].map(m=>`<label class="chk"><input type="checkbox" data-tp="${m}" ${c.tp.includes(m)?'checked':''}> ${m}</label>`).join('')}</div>
<div class="card"><h2>Fecha de carga</h2><p class="sub">Para que el reporte de rotación mida bien. Se pone a los artículos que todavía no tienen fecha.</p><div class="row" style="align-items:flex-end"><label>Fecha<input id="fcd" type="date" value="${today()}"></label><button class="pri" data-a="fapply">Aplicar</button></div></div>`}
function aqList(){const q=aqQ.trim().toLowerCase();return db.articles.filter(a=>(!aqPend||a.n===a.cod||a.rev||!a.fc)&&(!q||(a.cod||'').toLowerCase().includes(q)||a.n.toLowerCase().includes(q))).sort((a,b)=>(a.cod||'').localeCompare(b.cod||'','es',{numeric:true}))}
function aqTable(){const l=aqList(),per=25,pages=Math.max(1,Math.ceil(l.length/per));if(aqPg>=pages)aqPg=pages-1;const st=aqPg*per,pg=l.slice(st,st+per),inp=(a,f,t,v,ph)=>`<input data-qe="${f}" data-id="${a.id}" type="${t}" ${t==='number'?'inputmode="decimal" min="0" step="any"':''} value="${esc(v==null?'':v)}" ${ph?'placeholder="'+ph+'"':''}>`;
return `<p class="sub">${l.length} artículos</p><div class="scroll"><table class="tb aqt"><thead><tr><th>Código</th><th>Descripción</th><th class="r">Costo</th><th class="r">$ Efectivo</th><th class="r">$ Tarjeta</th><th>Fecha de carga</th></tr></thead><tbody>${pg.length?pg.map(a=>`<tr><td data-l="Código"><b>${esc(a.cod||'—')}</b>${a.rev?' <span class="chip bad">Revisar precio</span>':''}</td><td data-l="Descripción">${inp(a,'n','text',a.n===a.cod?'':a.n,'Descripción')}</td><td data-l="Costo" class="r">${inp(a,'cost','number',a.cost||'')}</td><td data-l="$ Efectivo" class="r">${inp(a,'p','number',a.p)}</td><td data-l="$ Tarjeta" class="r">${inp(a,'pt','number',a.pt==null?a.p:a.pt)}</td><td data-l="Fecha de carga">${inp(a,'fc','date',a.fc||'')}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">No hay artículos para mostrar.</td></tr>'}</tbody></table></div>
<div class="pgr"><span>Mostrando ${l.length?st+1:0} a ${Math.min(st+per,l.length)} de ${l.length}</span><div class="pgb"><button data-a="aqpg" data-p="${aqPg-1}" ${aqPg===0?'disabled':''}>Anterior</button><b>${aqPg+1}</b><button data-a="aqpg" data-p="${aqPg+1}" ${aqPg>=pages-1?'disabled':''}>Siguiente</button></div></div>`}
function aq(){return `<h1>Edición rápida de artículos</h1><p class="sub">Completá descripciones, precios y fechas de carga. Se guarda solo, al salir de cada casilla.</p><div class="card"><div class="tbar"><input id="aqq" type="search" placeholder="Buscar por código o descripción…" value="${esc(aqQ)}"><label class="chk" style="margin:0"><input type="checkbox" id="aqp" ${aqPend?'checked':''}> Solo pendientes</label></div><div id="aqt">${aqTable()}</div></div>`}
function svRows(nq){const q=nq?'':svQ.trim().toLowerCase(),k=svSort.k;return db.articles.map(a=>{const st=Math.max(0,a.s),c=a.cost||0,pm=(a.p+(a.pt==null?a.p:a.pt))/2;return{a,s:st,c,pm,vc:st*c,vv:st*pm,mg:st*(pm-c)}}).filter(r=>(svFlt==='todo'||r.s>0)&&(!q||(r.a.cod||'').toLowerCase().includes(q)||r.a.n.toLowerCase().includes(q))).sort((x,y)=>{const p=k==='cod'?(x.a.cod||''):k==='n'?x.a.n:x[k],q2=k==='cod'?(y.a.cod||''):k==='n'?y.a.n:y[k];return(typeof p==='number'?p-q2:String(p).localeCompare(String(q2),'es',{numeric:true}))*svSort.dir})}
function svTable(){const l=svRows(),tot=l.length,pages=Math.max(1,Math.ceil(tot/svPer));if(svPg>=pages)svPg=pages-1;const st=svPg*svPer,pg=l.slice(st,st+svPer),th=(k,t,c)=>`<th class="${c||''}"><button class="sb" data-a="svsort" data-k="${k}">${t}${svSort.k===k?(svSort.dir>0?' ▲':' ▼'):''}</button></th>`;
return `<div class="scroll"><table class="tb aqt"><thead><tr>${th('cod','Código')}${th('n','Descripción')}${th('s','Stock','r')}${th('c','Costo','r')}${th('pm','Precio venta prom.','r')}${th('vc','Valor a costo','r')}${th('vv','Valor a venta','r')}${th('mg','Margen','r')}</tr></thead><tbody>${pg.length?pg.map(r=>`<tr><td data-l="Código"><b>${esc(r.a.cod||'—')}</b></td><td data-l="Descripción">${esc(r.a.n)}</td><td class="r" data-l="Stock">${r.s}</td><td class="r" data-l="Costo">${r.c?money(r.c):'—'}</td><td class="r" data-l="Precio venta prom.">${money(r.pm)}</td><td class="r" data-l="Valor a costo">${money(r.vc)}</td><td class="r" data-l="Valor a venta">${money(r.vv)}</td><td class="r" data-l="Margen">${money(r.mg)}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">No hay artículos para mostrar.</td></tr>'}</tbody></table></div>
<div class="pgr"><span>Mostrar<select id="svper">${[10,25,50,100].map(n=>`<option ${n===svPer?'selected':''}>${n}</option>`).join('')}</select>registros</span><span>${tot?`Mostrando ${st+1} a ${Math.min(st+svPer,tot)} de ${tot}`:'Sin registros'}</span><div class="pgb"><button data-a="svpg" data-p="0" ${svPg===0?'disabled':''}>Primero</button><button data-a="svpg" data-p="${svPg-1}" ${svPg===0?'disabled':''}>Anterior</button><b>${svPg+1}</b><button data-a="svpg" data-p="${svPg+1}" ${svPg>=pages-1?'disabled':''}>Siguiente</button><button data-a="svpg" data-p="${pages-1}" ${svPg>=pages-1?'disabled':''}>Último</button></div></div>`}
function sv(){const all=svRows(true),t=all.reduce((x,r)=>({s:x.s+r.s,vc:x.vc+r.vc,vv:x.vv+r.vv,mg:x.mg+r.mg}),{s:0,vc:0,vv:0,mg:0}),sc=all.filter(r=>r.s>0&&!r.c).length;
return `<h1>Stock valorizado</h1><p class="sub">Cuánto vale toda tu mercadería. El precio de venta es el promedio entre efectivo y tarjeta.</p>
${sc?`<p class="note">⚠ ${sc} artículo(s) con stock no tienen costo cargado, así que no suman al valor a costo. <button class="lnk" data-t="aq">Cargar costos</button></p>`:''}
<div class="er4"><div><span>Unidades en stock</span><b>${t.s}</b><small class="mut">${all.filter(r=>r.s>0).length} artículos</small></div><div><span>Valor a costo</span><b>${money(t.vc)}</b><small class="mut">lo que te costó</small></div><div><span>Valor a precio de venta</span><b>${money(t.vv)}</b><small class="mut">promedio efectivo y tarjeta</small></div><div><span>Margen potencial</span><b style="color:var(--ac)">${money(t.mg)}</b><small class="mut">${t.vv?Math.round(t.mg/t.vv*100):0}% del valor de venta</small></div></div>
<div class="card"><div class="tbar"><div class="seg">${[['con','Con stock'],['todo','Todos']].map(m=>`<button data-a="svflt" data-m="${m[0]}" class="${svFlt===m[0]?'on':''}">${m[1]}</button>`).join('')}</div><input id="svq" type="search" placeholder="Buscar por código o descripción…" value="${esc(svQ)}"><button data-a="expsv">Excel</button></div><div id="svt">${svTable()}</div></div>`}
function mvList(){const L=[],ga=id=>db.articles.find(x=>x.id===id);
db.sales.forEach((s,si)=>{const no=s.n||si+1;s.items.forEach((i,k)=>{if(!i.aid)return;const a=ga(i.aid);L.push({id:s.id+k/10,date:s.date,cod:a?a.cod||'':'',n:a?a.n:i.n,type:'egreso',q:i.q,org:'Venta',det:'N° '+no+' · '+s.cli})})});
db.purchases.forEach(u=>{if(!u.aid)return;const a=ga(u.aid);L.push({id:u.id,date:u.date,cod:a?a.cod||'':'',n:a?a.n:u.art,type:'ingreso',q:u.q,org:'Compra',det:u.prov})});
db.smoves.forEach(m=>{L.push({id:m.id,date:m.date,cod:m.cod||'',n:m.n,type:m.type,q:m.q,org:m.motivo||'Ajuste de stock',det:m.obs||''})});return L}
function mvCat(e){return e.org==='Venta'?'ventas':e.org==='Compra'?'compras':e.org.startsWith('Devolución a')?'dp':/crédito/i.test(e.org)?'nc':'aj'}
function mvRows(){const q=mvQ.trim().toLowerCase();return mvList().filter(e=>(mvType==='todo'||e.type===mvType)&&(mvOrg==='todo'||mvCat(e)===mvOrg)&&(!mvFrom||e.date>=mvFrom)&&(!mvTo||e.date<=mvTo)&&(!q||e.cod.toLowerCase().includes(q)||e.n.toLowerCase().includes(q)||e.det.toLowerCase().includes(q)||e.org.toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)}
function mvTable(){const l=mvRows(),tot=l.length,pages=Math.max(1,Math.ceil(tot/mvPer));if(mvPg>=pages)mvPg=pages-1;const st=mvPg*mvPer,pg=l.slice(st,st+mvPer);
return `<div class="scroll"><table class="tb mvt"><thead><tr><th>Fecha</th><th>Artículo</th><th class="r">Cant.</th><th>Origen</th></tr></thead><tbody>${pg.length?pg.map(e=>`<tr><td style="white-space:nowrap">${dmy(e.date)}</td><td><b>${esc(e.cod||'—')}</b>${e.n!==e.cod?`<small>${esc(e.n)}</small>`:''}</td><td class="r" style="white-space:nowrap;font-weight:700;color:${e.type==='ingreso'?'var(--ac)':'var(--bad)'}">${e.type==='ingreso'?'+':'−'}${e.q}</td><td><span class="chip ${e.type==='egreso'?'bad':''}">${esc(e.org)}</span>${e.det?`<small>${esc(e.det)}</small>`:''}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No hay movimientos con estos filtros.</td></tr>'}</tbody></table></div>
<div class="pgr"><span>Mostrar<select id="mvper">${[10,25,50,100].map(n=>`<option ${n===mvPer?'selected':''}>${n}</option>`).join('')}</select>registros</span><span>${tot?`Mostrando ${st+1} a ${Math.min(st+mvPer,tot)} de ${tot} movimientos`:'Sin movimientos'}</span><div class="pgb"><button data-a="mvpg" data-p="0" ${mvPg===0?'disabled':''}>Primero</button><button data-a="mvpg" data-p="${mvPg-1}" ${mvPg===0?'disabled':''}>Anterior</button><b>${mvPg+1}</b><button data-a="mvpg" data-p="${mvPg+1}" ${mvPg>=pages-1?'disabled':''}>Siguiente</button><button data-a="mvpg" data-p="${pages-1}" ${mvPg>=pages-1?'disabled':''}>Último</button></div></div>`}
function smv(){return `<h1>Movimientos de stock</h1><div class="card"><div class="tbar"><div class="seg">${[['todo','Todos'],['ingreso','Ingresos'],['egreso','Egresos']].map(m=>`<button data-a="mvt" data-m="${m[0]}" class="${mvType===m[0]?'on':''}">${m[1]}</button>`).join('')}</div>${isAdmin()?'<div class="tb2"><button class="pri" data-t="smov" data-f="mi">+ Nuevo ingreso</button><button data-t="smov" data-f="me">Nuevo egreso</button></div>':''}</div>
<div class="tbar"><select id="mvo" style="max-width:250px">${[['todo','Todos los orígenes'],['ventas','Ventas'],['compras','Compras'],['nc','Notas de crédito'],['dp','Devoluciones a proveedor'],['aj','Ajustes y otros']].map(o=>`<option value="${o[0]}" ${mvOrg===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><label class="dt">Desde<input id="mvf" type="date" value="${mvFrom}"></label><label class="dt">Hasta<input id="mvh" type="date" value="${mvTo}"></label></div>
<div class="tbar"><input id="mvq" type="search" placeholder="Buscar por código, descripción u origen…" value="${esc(mvQ)}"><button data-a="expmv">Excel</button></div><div id="mvtab">${mvTable()}</div></div>`}
function smov(){const ing=smType==='ingreso',rec=db.smoves.slice().sort((a,b)=>b.id-a.id).slice(0,30);
return `<h1>Nuevo ${smType}</h1><p class="sub">${ing?'Suma':'Resta'} unidades al stock. Escribí o escaneá el código y apretá Enter.</p>
<datalist id="arts3">${db.articles.map(a=>`<option value="${esc(a.n)}">`).join('')}</datalist><datalist id="cods3">${db.articles.filter(a=>a.cod).map(a=>`<option value="${esc(a.cod)}">${esc(a.n)}</option>`).join('')}</datalist>
<div class="card"><div class="seg" style="margin-bottom:12px">${[['ingreso','Ingreso'],['egreso','Egreso']].map(m=>`<button data-a="smt" data-m="${m[0]}" class="${smType===m[0]?'on':''}">${m[1]}</button>`).join('')}</div>
<div class="row smr" style="align-items:flex-end"><label>Código<input id="mc" list="cods3" autocomplete="off"></label><label>Artículo<input id="mn" list="arts3" autocomplete="off"></label><label>Cantidad<input id="mq" type="number" inputmode="decimal" min="0" step="any" value="1"></label><button class="pri" data-a="smadd">Agregar</button></div>
${smCart.length?smCart.map((l,n)=>`<div class="li"><div>${esc(l.n)}<small>${esc(l.cod)}</small></div><div>${ing?'+':'−'}${l.q} <button class="x" data-a="smrm" data-i="${n}">Quitar</button></div></div>`).join(''):'<p class="empty">Todavía no agregaste artículos.</p>'}
<label style="margin-top:10px">Motivo<select id="mm">${(ing?MOT_I:MOT_E).map(x=>`<option ${x===smMot?'selected':''}>${x}</option>`).join('')}</select></label><label>Observación<input id="mo" value="${esc(smObs)}"></label><button class="pri big" data-a="smok">Confirmar ${smType}</button></div>
<div class="card"><h2>Últimos movimientos</h2>${rec.length?rec.map(m=>`<div class="li"><div>${esc(m.n)}<small>${dmy(m.date)} · ${m.type==='ingreso'?'Ingreso':'Egreso'} · ${esc(m.motivo||'Ajuste de stock')}${m.obs?' · '+esc(m.obs):''}</small></div><div>${m.type==='ingreso'?'+':'−'}${m.q} <button class="x" data-a="smundo" data-id="${m.id}">Anular</button></div></div>`).join(''):'<p class="empty">Sin movimientos.</p>'}</div>`}
function clientes(){const deb=db.clients.reduce((a,c)=>a+saldoC(c),0);return `<h1>Clientes</h1><p class="sub">Te deben: ${money(deb)}. Tocá un cliente para ver sus ventas y pagos.</p>
<div class="card"><h2>Nuevo cliente</h2><label>Nombre<input id="cn"></label><div class="row"><label>Teléfono<input id="ct" type="tel"></label><label>Dirección<input id="cd"></label></div><button class="pri big" data-a="addc">Guardar cliente</button></div>
<div class="card"><h2>Registrar cobro</h2>${db.clients.length?`<label>Cliente<select id="cbs">${db.clients.map(c=>`<option value="${c.id}">${esc(c.n)} (${money(saldoC(c))})</option>`).join('')}</select></label><label>Monto cobrado $<input id="cbm" type="number" inputmode="decimal" min="0"></label>${medioSel('cbmd')}<button class="pri big" data-a="addcb">Registrar cobro</button>`:'<p class="empty">Cargá un cliente primero.</p>'}</div>
<div class="card"><h2>Listado</h2>${db.clients.length?db.clients.map(c=>`<div class="li"><div><button class="lnk" data-a="cliopen" data-id="${c.id}"><b>${esc(c.n)}</b></button><small>Cta Cte ${money(ctaC(c))} · Cobrado ${money(cobC(c))}${c.d?' · '+esc(c.d):''}${c.t?' · <a href="tel:'+esc(c.t)+'" style="color:var(--ac)">'+esc(c.t)+'</a>':''}</small></div><div style="text-align:right"><small>Debe</small><b style="display:block">${money(saldoC(c))}</b>${isAdmin()?`<button class="x" data-a="delc" data-id="${c.id}">Eliminar</button>`:''}</div></div>`).join(''):'<p class="empty">Cargá tu primer cliente arriba.</p>'}</div>`}
function compras(){const ops=db.providers.map(p=>`<option value="${p.id}">${esc(p.n)} (${money(saldoP(p))})</option>`).join('');const rec=db.purchases.slice().sort((a,b)=>b.id-a.id).slice(0,30);
